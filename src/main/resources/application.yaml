server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    discovery:
      client:
        simple:
          instances:
            login:
              - uri: ${LOGIN_URL:http://localhost:8082}
            usuario:
              - uri: ${USUARIO_URL:http://localhost:8083}
            marketplace:
              - uri: ${MARKETPLACE_URL:http://localhost:8084}
            card-pokemon:
              - uri: ${CARD_POKEMON_URL:http://localhost:8085}

              
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Headers Access-Control-Allow-Methods Access-Control-Expose-Headers, RETAIN_FIRST
      routes:
        - id: login
          uri: lb://login
          predicates:
            - Path=/v1/**, /login/**, /auth/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                methods: GET
                backoff:
                  firstBackoff: 10ms
                  maxBackoff: 50ms
                  factor: 2
                  basedOnPreviousValue: true
        - id: card-pokemon
          uri: lb://card-pokemon
          predicates:
            - Path=/card-pokemon/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                methods: GET
                backoff:
                  firstBackoff: 10ms
                  maxBackoff: 50ms
                  factor: 2
                  basedOnPreviousValue: true
        - id: marketplace
          uri: lb://marketplace
          predicates:
            - Path=/api/venda-poke/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                methods: GET
                backoff:
                  firstBackoff: 10ms
                  maxBackoff: 50ms
                  factor: 2
                  basedOnPreviousValue: true
        - id: usuario
          uri: lb://usuario
          predicates:
            - Path=/usuario/**
          filters:
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                methods: GET
                backoff:
                  firstBackoff: 10ms
                  maxBackoff: 50ms
                  factor: 2
                  basedOnPreviousValue: true

  cors:
    url: ${CORS_ORIGINS:http://localhost:8081,http://localhost:3000,https://localhost:3000}


logging:
  level:
    org.springframework.cloud.gateway: DEBUG